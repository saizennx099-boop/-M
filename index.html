<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖤</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{\n  --navy:#030812;\n  --navy2:#061124;\n  --navy3:#0c1d3a;\n  --gold:#b89742;\n  --gold2:#dfc681;\n  --paper:#fcfaf2;\n  --ink:#1a2130;\n}
html,body{width:100%;height:100%;overflow:hidden;background:var(--navy);font-family:'Cormorant Garamond',serif;user-select:none;}

/* ── DERİN ARKA PLAN VE NEBULA ETKİSİ ── */
#bg{
  position:fixed;inset:0;z-index:0;
  background: 
    radial-gradient(circle at 30% 40%, rgba(12, 29, 58, 0.6) 0%, transparent 45%),
    radial-gradient(circle at 85% 20%, rgba(8, 20, 41, 0.5) 0%, transparent 40%),
    linear-gradient(135deg, #030813 0%, #010408 100%);
}

/* ── KANVAS (GÜLLER VE YAPRAKLAR İÇİN) ── */
#canvas-layer {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
}

/* ── SİLİK GİZEMLİ AY ── */
.moon {
  position:fixed;top:6vh;right:8vw;z-index:1;
  width:75px;height:75px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #d8c397, #93783a 45%, #2a220f 90%);
  box-shadow:0 0 40px rgba(184,151,66,0.15), 0 0 100px rgba(12,29,58,0.4);
  opacity: 0.65;
  animation: moonPulse 8s ease-in-out infinite;
}
@keyframes moonPulse { 0%,100%{opacity:0.55;transform:scale(1);} 50%{opacity:0.7;transform:scale(1.03);} }

/* ── SAHNE DÜZENİ ── */
#scene{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2rem;
}

/* Üst İpucu */
.hint{
  font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:6px;
  color:rgba(223,198,129,0.45);text-transform:uppercase;
  text-shadow: 0 0 10px rgba(184,151,66,0.2);
  animation:hintPulse 3s ease-in-out infinite;transition:opacity .8s;
}
@keyframes hintPulse{0%,100%{opacity:.25;transform:translateY(0);}50%{opacity:0.8;transform:translateY(-3px);}}

/* ── ASİL ZARF TASARIMI ── */
#envelope-wrap{
  position:relative;width:370px;height:255px;
  cursor:pointer;
  filter:drop-shadow(0 30px 70px rgba(0,0,0,0.85)) drop-shadow(0 0 50px rgba(12,29,58,0.25));
  transition:transform .4s cubic-bezier(0.25, 1, 0.5, 1), filter .4s ease;
}
#envelope-wrap:hover{
  transform:scale(1.04) translateY(-8px);
  filter:drop-shadow(0 40px 85px rgba(0,0,0,0.95)) drop-shadow(0 0 70px rgba(184,151,66,0.15));
}

.env-body{
  position:absolute;inset:0;
  background:linear-gradient(145deg,#07142b 0%,#030914 100%);
  border-radius:4px;
  border:1px solid rgba(184,151,66,0.25);
  overflow:hidden;
}

.env-stripe{
  position:absolute;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(184,151,66,0.15),transparent);
}

.env-left{position:absolute;bottom:0;left:0;width:0;height:0;z-index:3;border-bottom:255px solid #040d1c;border-right:185px solid transparent;}
.env-right{position:absolute;bottom:0;right:0;width:0;height:0;z-index:3;border-bottom:255px solid #040d1c;border-left:185px solid transparent;}
.env-bottom{
  position:absolute;bottom:0;left:0;right:0;height:48%;z-index:2;
  background:linear-gradient(to top,#020610,#07152c);
  border-top:1px solid rgba(184,151,66,0.15);
}

.env-flap{
  position:absolute;top:0;left:0;right:0;z-index:5;height:0;width:0;
  border-left:185px solid transparent;
  border-right:185px solid transparent;
  border-top:152px solid #081732;
  transform-origin:top center;
  transition:transform 1.4s cubic-bezier(.4,0,.2,1);
}
.env-flap::after{
  content:'';position:absolute;top:-152px;left:-185px;right:-185px;
  border-left:185px solid transparent;
  border-right:185px solid transparent;
  border-top:152px solid rgba(184,151,66,0.08);
}

/* Balmumu Mühür */
.seal{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) translateY(18px);
  z-index:6;width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#dfc681 0%,#a28132 55%,#544113 100%);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 6px 25px rgba(0,0,0,0.65), inset 0 2px 4px rgba(255,255,255,0.15);
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  transition:opacity .4s, transform .6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Zarfın İçindeki Küçük Kağıt Parçası */
#letter{
  position:absolute;width:325px;left:50%;transform:translateX(-50%);
  bottom:15px;z-index:4;
  background:var(--paper);border-radius:2px;padding:2rem;
  box-shadow:0 -5px 25px rgba(0,0,0,0.5);
  transition:bottom 1.6s cubic-bezier(.4,0,.2,1), opacity .6s;
  opacity:0;max-height:180px;overflow:hidden;
}
#letter p{font-family:'IM Fell English',serif;font-size:.85rem;line-height:1.8;color:var(--ink);opacity:0.75;}

/* ── AÇILMA ANİMASYON DURUMLARI ── */
.opened .env-flap{transform:rotateX(180deg); z-index:1;}
.opened .seal{opacity:0;transform:translate(-50%,-50%) scale(0.3) rotate(45deg); pointer-events:none;}
.opened #letter{bottom:180px;opacity:1;}
.opened #envelope-wrap{cursor:default;transform:none !important;filter:drop-shadow(0 20px 50px rgba(0,0,0,0.8)) !important;}
.opened .hint{opacity:0;pointer-events:none;}

/* ── TAM MEKTUP EKRANI (MÜKEMMEL PARLAKLIK) ── */
#full-letter{
  position:fixed;inset:0;z-index:100;
  background:rgba(2,5,11,0.97);
  display:flex;align-items:center;justify-content:center;
  padding:2rem;opacity:0;pointer-events:none;
  transition:opacity 1.2s ease;
  backdrop-filter:blur(8px);
}
#full-letter.visible{opacity:1;pointer-events:all;}

.letter-paper{
  background:var(--paper);
  max-width:560px;width:100%;max-height:85vh;overflow-y:auto;
  border-radius:4px;padding:4.5rem 4.5rem 4rem;position:relative;
  box-shadow:0 50px 130px rgba(0,0,0,0.9), 0 0 0 1px rgba(184,151,66,0.15);
  transform:translateY(40px) scale(0.95);
  transition:transform 1.2s cubic-bezier(0.15, 1, 0.3, 1);
}
#full-letter.visible .letter-paper{transform:translateY(0) scale(1);}

.letter-paper::before{
  content:'';position:absolute;inset:0;border-radius:4px;
  background:repeating-linear-gradient(transparent,transparent 33px,rgba(26,33,48,0.04) 33px,rgba(26,33,48,0.04) 34px);
  pointer-events:none;
}
.letter-paper::after{
  content:'';position:absolute;top:0;bottom:0;left:4.5rem;width:1px;
  background:linear-gradient(to bottom,transparent,rgba(184,151,66,0.15),transparent);
  pointer-events:none;
}

.letter-ornament{
  text-align:center;margin-bottom:2.5rem;
  font-size:.8rem;letter-spacing:10px;
  color:rgba(162,129,50,0.4);font-family:'Cinzel',serif;
}

.letter-body{
  font-family:'IM Fell English',serif;font-size:1.1rem;
  line-height:2.1;color:var(--ink);
  white-space:pre-line;text-align:justify;
}

.letter-sig{
  margin-top:4rem;text-align:right;
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:1.25rem;color:rgba(26,33,48,0.6);
  font-weight: 600;
}

.close-btn{
  position:fixed;top:2rem;right:2rem;
  background:none;border:1px solid rgba(184,151,66,0.25);
  border-radius:50%;width:44px;height:44px;
  color:rgba(223,198,129,0.5);font-size:1.1rem;cursor:pointer;
  transition:all .3s ease;display:flex;align-items:center;justify-content:center;
}
.close-btn:hover{background:rgba(184,151,66,0.1);color:var(--gold2);border-color:rgba(184,151,66,0.6);transform:rotate(90deg);}

.letter-paper::-webkit-scrollbar{width:4px;}
.letter-paper::-webkit-scrollbar-thumb{background:rgba(184,151,66,0.3);border-radius:2px;}

@media(max-width:440px){
  #envelope-wrap{width:310px;height:215px;}
  .env-flap{border-left-width:155px;border-right-width:155px;border-top-width:128px;}
  .env-left{border-bottom-width:215px;border-right-width:155px;}
  .env-right{border-bottom-width:215px;border-left-width:155px;}
  #letter{width:270px;}
  .letter-paper{padding:3.5rem 2rem 3rem;}
  .letter-paper::after{left:2rem;}
}
</style>
</head>
<body>

<div id="bg"></div>
<div class="moon"></div>
<canvas id="canvas-layer"></canvas>

<div id="scene">
  <p class="hint">dokun ve aç</p>

  <div id="envelope-wrap" onclick="openEnvelope()">
    <div class="env-body">
      <div class="env-stripe" style="top:33%"></div>
      <div class="env-stripe" style="top:65%"></div>
      <div class="env-bottom"></div>
      <div class="env-left"></div>
      <div class="env-right"></div>
      <div id="letter">
        <p>Sevgili Meryem...</p>
      </div>
    </div>
    <div class="env-flap"></div>
    <div class="seal">💙</div>
  </div>
</div>

<div id="full-letter">
  <button class="close-btn" onclick="closeFull()">✕</button>
  <div class="letter-paper">
    <div class="letter-ornament">✦   M E R Y E M ' E   ✦</div>
    <div class="letter-body" id="letter-content"></div>
    <div class="letter-sig">Son Kez, Gönülden Sevgilerle...</div>
  </div>
</div>

<script>
// ── BURAYA KENDİ SON MEKTUBUNU YAZABİLİRSİN ──
const NOTE = `Sevgili Meryem,

Buraya yazacağım kelimeleri seçmek ne kadar zor olsa da, bu sana olan son sözlerim... Seninle geçen her an, hayatımın en özel ve unutulmaz sayfaları olarak kalacak. 

Sana hayatın boyunca hak ettiğin tüm mutlulukları, huzuru ve güzellikleri diliyorum. Kendine her zaman çok iyi bak.

Seni daima derin bir sevgiyle hatırlayacağım...`;

document.getElementById('letter-content').textContent = NOTE;

// ── GELİŞMİŞ LACİVERT GÜL VE YAPRAK PARÇACIK MOTORU ──
const canvas = document.getElementById('canvas-layer');
const ctx = canvas.getContext('2d');

let particles = [];
const particleCount = 45;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Yaprak ve Gül Paleti (Zengin Gece Mavisi Tonları)
const roseColors = [
  { main: '#081a3e', shadow: '#030a1a', highlight: '#122f6d', op: 0.7 },
  { main: '#0a2354', shadow: '#040e24', highlight: '#18428c', op: 0.6 },
  { main: '#112e66', shadow: '#06132e', highlight: '#2153b0', op: 0.5 },
  { main: '#05122c', shadow: '#01040f', highlight: '#0d255c', op: 0.8 }
];

class Particle {
  constructor() {
    this.reset();
    this.y = Math.random() * canvas.height; // İlk açılışta ekrana dağılsınlar
  }

  reset() {
    this.x = Math.random() * canvas.width;
    this.y = -40;
    this.size = 6 + Math.random() * 16;
    this.speedY = 0.4 + Math.random() * 0.9;
    this.speedX = (Math.random() - 0.5) * 0.4;
    this.angle = Math.random() * Math.PI * 2;
    this.spin = (Math.random() - 0.5) * 0.015;
    this.color = roseColors[Math.floor(Math.random() * roseColors.length)];
    this.type = Math.random() > 0.35 ? 'petal' : 'rose'; // %65 Yaprak, %35 Tam Gül tomurcuğu
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.globalAlpha = this.color.op;

    // 3D Derinlik fluluğu efekti
    if (this.size > 16) {
      ctx.filter = 'blur(1.5px)';
    } else if (this.size < 9) {
      ctx.filter = 'blur(0.5px)';
    } else {
      ctx.filter = 'none';
    }

    if (this.type === 'petal') {
      // RÜZGARDA SÜZÜLEN LACİVERT YAPRAK ÇİZİMİ
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-this.size, -this.size/2, -this.size, this.size, 0, this.size * 1.3);
      ctx.bezierCurveTo(this.size, this.size, this.size, -this.size/2, 0, 0);
      
      let grad = ctx.createRadialGradient(-this.size/4, this.size/4, 1, 0, this.size/2, this.size);
      grad.addColorStop(0, this.color.highlight);
      grad.addColorStop(0.5, this.color.main);
      grad.addColorStop(1, this.color.shadow);
      
      ctx.fillStyle = grad;
      ctx.fill();

      // Damar çizgisi
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-this.size/6, this.size/2, 0, this.size * 1.1);
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.stroke();

    } else {
      // SOYUT GECE GÜLÜ ÇİZİMİ (İÇ İÇE GEÇMİŞ KATMANLAR)
      const r = this.size * 0.8;
      
      // Dış yaprak halkası
      ctx.fillStyle = this.color.shadow;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();

      // Orta Katmanlar
      for(let i=0; i<5; i++) {
        ctx.fillStyle = i % 2 === 0 ? this.color.main : this.color.highlight;
        ctx.beginPath();
        ctx.ellipse(Math.cos(i)*2, Math.sin(i)*2, r*0.7, r*0.4, i * 45 * Math.PI/180, 0, Math.PI*2);
        ctx.fill();
      }
      
      // Gül merkezi parıltısı
      ctx.fillStyle = 'rgba(223,198,129,0.15)';
      ctx.beginPath(); ctx.arc(0, 0, r*0.2, 0, Math.PI*2); ctx.fill();
    }

    ctx.restore();
  }

  update() {
    this.y += this.speedY;
    this.x += this.speedX + Math.sin(this.y / 30) * 0.15; // Hafif süzülme dalgası
    this.angle += this.spin;

    if (this.y > canvas.height + 40 || this.x < -40 || this.x > canvas.width + 40) {
      this.reset();
    }
  }
}

// Parçacıkları oluştur
for (let i = 0; i < particleCount; i++) {
  particles.push(new Particle());
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  
  requestAnimationFrame(animate);
}
animate();

// ── ZARF ETKİLEŞİM FONKSİYONLARI ──
let opened = false;
function openEnvelope(){
  if(opened) return;
  opened = true;
  document.getElementById('scene').classList.add('opened');
  
  // Zarf kapağı döndükten sonra tam mektup asaletle belirsin
  setTimeout(() => {
    document.getElementById('full-letter').classList.add('visible');
  }, 1800);
}

function closeFull(){
  document.getElementById('full-letter').classList.remove('visible');
}

// Esc tuşuna basınca mektup kapansın
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeFull(); });
</script>
</body>
</html>
